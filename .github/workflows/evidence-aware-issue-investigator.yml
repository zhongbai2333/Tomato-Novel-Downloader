name: Evidence-Aware Issue Investigation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-aware-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  investigate:
    if: github.event.issue.pull_request == null && github.event.label.name == 'AI-Investigate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Investigate issue evidence
        id: investigate
        uses: zhongbai2333/Evidence-Aware-Issue-Investigator@559058a23cf720b9981da01faa5f90b11b0c4bde
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          github-token: ${{ github.token }}
          config-path: .github/issue-investigator.yml
          publish-comment: "true"

      - name: Remove investigation trigger label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'AI-Investigate'
              });
            } catch (error) {
              if (error?.status !== 404) throw error;
            }
