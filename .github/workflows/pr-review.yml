name: PR multi-platform build

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    if: github.event.label.name == 'run-build'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-build
            platform: Linux_amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64-build
            platform: Linux_arm64
          - runner: ubuntu-latest
            artifact: linux-musl-build
            platform: Linux_musl_amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            artifact: android-arm64-build
            platform: Android_arm64
            target: aarch64-linux-android
          - runner: windows-latest
            artifact: windows-build
            platform: Win64
          - runner: macos-latest
            artifact: macos-build
            platform: macOS_arm64
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare the public build manifest
        shell: bash
        run: python3 scripts/prepare-public-build.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Android SDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          sdkmanager "ndk;26.1.10909125"
          toolchain="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android21-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build public artifact
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo_args=(--release --no-default-features)
          output="target/release"
          features="no-official-api,tts,clipboard,clipboard-arboard"
          if [[ -n "$BUILD_TARGET" ]]; then
            cargo_args+=(--target "$BUILD_TARGET")
            output="target/$BUILD_TARGET/release"
            features="no-official-api,tts-native,clipboard"
          fi
          cargo build "${cargo_args[@]}" --features "$features"
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          mkdir -p dist
          cp "$output/tomato-novel-downloader$suffix" "dist/TomatoNovelDownloader-$BUILD_PLATFORM-sha-$GITHUB_SHA$suffix"

      - name: Upload public artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/TomatoNovelDownloader-*
          if-no-files-found: error
