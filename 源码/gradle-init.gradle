// Gradle init script - Aliyun mirror repositories
// Usage: gradle --init-script /workspace/gradle-init.gradle <task>
// Or copy to ~/.gradle/init.d/mirror.gradle

allprojects {
    buildscript {
        repositories {
            // Remove Google's default repos to override with mirrors
            all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository) {
                    def url = repo.url.toString()
                    if (url.startsWith('https://dl.google.com') ||
                        url.startsWith('https://maven.google.com') ||
                        url.startsWith('https://repo1.maven.org/maven2') ||
                        url.startsWith('https://jcenter.bintray.com')) {
                        project.logger.lifecycle "Repository ${repo.url} replaced by Aliyun mirror."
                        remove repo
                    }
                }
            }
            // Aliyun mirrors
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/jcenter' }
            mavenCentral()
            google()
        }
    }

    repositories {
        all { ArtifactRepository repo ->
            if (repo instanceof MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.startsWith('https://dl.google.com') ||
                    url.startsWith('https://maven.google.com') ||
                    url.startsWith('https://repo1.maven.org/maven2') ||
                    url.startsWith('https://jcenter.bintray.com')) {
                    project.logger.lifecycle "Repository ${repo.url} replaced by Aliyun mirror."
                    remove repo
                }
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        mavenCentral()
        google()
    }
}
