name: Quality Checks

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cargo_no_official.toml"
      - "scripts/**"
      - "MAINTAINING.md"
      - ".github/workflows/quality.yml"
  workflow_dispatch:
    inputs:
      live_tts:
        description: Also synthesize a short sample with each TTS backend on Windows.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  default-features:
    name: Default features
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout downloader
        uses: actions/checkout@v4

      - name: Checkout Tomato-Novel-Official-API
        uses: actions/checkout@v4
        with:
          repository: zhongbai2333/Tomato-Novel-Official-API
          token: ${{ secrets.OAPI }}
          path: Tomato-Novel-Official-API

      - name: Link Official-API path dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/../Tomato-Novel-Official-API" || true
          ln -s "$GITHUB_WORKSPACE/Tomato-Novel-Official-API" "$GITHUB_WORKSPACE/../Tomato-Novel-Official-API"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            Tomato-Novel-Official-API/target
          key: ${{ runner.os }}-quality-default-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-default-
            ${{ runner.os }}-quality-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  no-official-api:
    name: no-official-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloader
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-no-official-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-no-official-
            ${{ runner.os }}-quality-

      - name: Prepare public build manifest
        shell: python
        run: |
          from pathlib import Path
          manifest = Path("Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('official-api = ["dep:tomato-novel-official-api"]', 'official-api = []')
          text = "\n".join(line for line in text.splitlines() if not line.startswith("tomato-novel-official-api =")) + "\n"
          manifest.write_text(text, encoding="utf-8")

      - name: Run tests
        run: cargo test --no-default-features --features no-official-api

      - name: Run clippy
        run: cargo clippy --no-default-features --features no-official-api --all-targets -- -D warnings

  windows-tts:
    name: Windows TTS (${{ matrix.backend }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tts, tts-native]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tts-${{ matrix.backend }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tts-${{ matrix.backend }}-
      - name: Prepare public build manifest
        shell: python
        run: |
          from pathlib import Path
          manifest = Path("Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('official-api = ["dep:tomato-novel-official-api"]', 'official-api = []')
          text = "\n".join(line for line in text.splitlines() if not line.startswith("tomato-novel-official-api =")) + "\n"
          manifest.write_text(text, encoding="utf-8")

      - name: Run book export and TTS regression tests
        run: |
          cargo test --no-default-features --features no-official-api,${{ matrix.backend }} book_parser::

      - name: Synthesize a sample through the audiobook export pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.live_tts
        env:
          TOMATO_TTS_SMOKE_DIR: ${{ runner.temp }}/tts-${{ matrix.backend }}
        run: cargo test --no-default-features --features no-official-api,${{ matrix.backend }} live_audiobook_generation -- --ignored --nocapture

      - name: Retain live audio evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_tts
        uses: actions/upload-artifact@v4
        with:
          name: windows-tts-${{ matrix.backend }}
          path: ${{ runner.temp }}/tts-${{ matrix.backend }}/**/*.mp3
          if-no-files-found: warn
          retention-days: 7
